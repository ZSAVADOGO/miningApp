{% comment %} <h3 class="text-2xl font-bold text-gray-900 mb-1">{{ article.titre }} </h3> {% endcomment %}
<h3 class="text-lg font-semibold text-gray-800 mb-2">{{ article.titre }}</h3>


<p class="text-sm text-gray-500 mb-1">
    Publié le {{ article.date_publication|date:"d/m/Y" }}
</p>
<span class="inline-block bg-gray-200 text-gray-700 text-xs px-2 py-1 rounded-full mb-4">
     <B> Source :</B> {{ article.source }} </span> 
     <a target="_blank" href="{{ article.source_lien }}" class="inline-block bg-gray-200 text-gray-700 text-xs px-2 py-1 rounded-full mb-4">
      Lien</a>
{% comment %} <div class="prose max-w-none mb-6">{{ article.contenu|linebreaks }}</div> {% endcomment %}
<div class="prose max-w-none mb-6">{{ article.contenu }}</div>
